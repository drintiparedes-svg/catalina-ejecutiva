<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover deja que el retrato llegue al borde de la pantalla,
       incluida la zona de la muesca; los controles se apartan solos con
       env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050b12">
  <title>Catalina — Avatar conversacional</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">
    <canvas id="avatar" aria-label="Avatar animado de Catalina"></canvas>
    <div class="vignette"></div>
    <section class="identity" aria-live="polite">
      <span class="signal" id="signal"></span>
      <div>
        <p class="eyebrow">ASISTENTE CONVERSACIONAL</p>
        <h1>Catalina</h1>
        <p class="status" id="status">Lista para comenzar</p>
      </div>
    </section>
    <section class="caption" id="caption" aria-live="polite" data-visible="false"></section>

    <aside class="panel" id="panel" data-open="false" aria-label="Historial de la conversación">
      <header class="panel-head">
        <span class="panel-title">Conversación</span>
        <button class="panel-close" id="panelClose" aria-label="Cerrar el historial">&minus;</button>
      </header>
      <div class="panel-body" id="panelBody">
        <p class="panel-empty">Lo que diga Catalina irá quedando aquí.</p>
      </div>
    </aside>

    <figure class="imagen" id="imagen" data-estado="oculto">
      <button class="imagen-cerrar" id="imagenCerrar" aria-label="Cerrar la imagen">&times;</button>
      <div class="imagen-cargando" aria-hidden="true"><span></span><span></span><span></span></div>
      <img id="imagenFoto" alt="">
      <figcaption>
        <span id="imagenPie"></span>
        <a id="imagenCredito" target="_blank" rel="noopener noreferrer"></a>
      </figcaption>
      <div class="imagen-galeria" id="imagenGaleria" hidden></div>
    </figure>

    <aside class="referencias" id="referencias" data-estado="oculto" aria-label="Referencias">
      <header class="referencias-cabecera">
        <span id="referenciasTitulo">Referencias</span>
        <span class="referencias-controles">
          <button class="referencias-ampliar" id="referenciasAmpliar" hidden aria-expanded="false">Ver las 20</button>
          <button class="referencias-cerrar" id="referenciasCerrar" aria-label="Cerrar las referencias">&times;</button>
        </span>
      </header>
      <ol id="referenciasLista"></ol>
    </aside>

    <!-- Botonera de teléfono. Aparece cuando se pide una llamada (con el número
         ya escrito) o al pulsar «Teléfono» para marcar a mano. El indicador de
         arriba muestra en vivo si la llamada se está conectando. -->
    <aside class="marcador" id="marcador" data-estado="oculto" aria-label="Botonera de teléfono">
      <header class="marcador-cabecera">
        <span class="marcador-titulo">Teléfono</span>
        <button class="marcador-cerrar" id="marcadorCerrar" aria-label="Cerrar la botonera">&times;</button>
      </header>
      <div class="marcador-estado" id="marcadorEstado" data-fase="idle">
        <span class="marcador-punto" id="marcadorPunto"></span>
        <span id="marcadorEstadoTexto">Listo para marcar</span>
      </div>
      <input class="marcador-numero" id="marcadorNumero" inputmode="tel" autocomplete="off"
             spellcheck="false" placeholder="+56 9 1234 5678" aria-label="Número de teléfono">
      <label class="marcador-campo" for="marcadorObjetivo">Objetivo de la llamada</label>
      <input class="marcador-texto" id="marcadorObjetivo" autocomplete="off"
             placeholder="Agendar hora con el dentista" aria-label="Objetivo de la llamada">
      <label class="marcador-campo" for="marcadorAQuien">A quién llamas <span>(opcional)</span></label>
      <input class="marcador-texto" id="marcadorAQuien" autocomplete="off"
             placeholder="Clínica dental Los Andes" aria-label="A quién llamas">
      <label class="marcador-campo" for="marcadorRestricciones">Preferencias <span>(opcional)</span></label>
      <input class="marcador-texto" id="marcadorRestricciones" autocomplete="off"
             placeholder="Por la tarde, esta semana" aria-label="Preferencias o restricciones">

      <div class="marcador-teclas" id="marcadorTeclas">
        <button class="tecla" data-d="1"><b>1</b><i></i></button>
        <button class="tecla" data-d="2"><b>2</b><i>ABC</i></button>
        <button class="tecla" data-d="3"><b>3</b><i>DEF</i></button>
        <button class="tecla" data-d="4"><b>4</b><i>GHI</i></button>
        <button class="tecla" data-d="5"><b>5</b><i>JKL</i></button>
        <button class="tecla" data-d="6"><b>6</b><i>MNO</i></button>
        <button class="tecla" data-d="7"><b>7</b><i>PQRS</i></button>
        <button class="tecla" data-d="8"><b>8</b><i>TUV</i></button>
        <button class="tecla" data-d="9"><b>9</b><i>WXYZ</i></button>
        <button class="tecla" data-d="*"><b>&lowast;</b><i></i></button>
        <button class="tecla" data-d="0"><b>0</b><i>+</i></button>
        <button class="tecla" data-d="#"><b>#</b><i></i></button>
      </div>
      <div class="marcador-acciones">
        <button class="marcador-borrar" id="marcadorBorrar" aria-label="Borrar un dígito">&#9003;</button>
        <button class="marcador-llamar" id="marcadorLlamar" aria-label="Llamar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1l-2.2 2.2z"/></svg>
          <span>Llamar</span>
        </button>
        <button class="marcador-colgar" id="marcadorColgar" aria-label="Colgar" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c3 0 5.9.7 8.4 2 .6.3 1 .9 1 1.6v2.3c0 .8-.7 1.5-1.5 1.4l-3-.3c-.7-.1-1.2-.6-1.3-1.3l-.3-1.8c-2.1-.7-4.4-.7-6.5 0l-.3 1.8c-.1.7-.6 1.2-1.3 1.3l-3 .3C2.7 12.7 2 12 2 11.2V8.9c0-.7.4-1.3 1-1.6C5.6 5.7 8.5 5 12 5z"/></svg>
          <span>Colgar</span>
        </button>
      </div>
    </aside>

    <nav class="controls" aria-label="Controles">
      <button class="primary" id="connect">Iniciar conversación</button>
      <button id="mute" disabled>Silenciar micrófono</button>
      <button id="abrirMarcador" title="Abre la botonera para marcar a mano">Teléfono</button>
      <button id="togglePanel" aria-pressed="false" title="Abre el historial de la conversación">Historial</button>
      <button id="meetMode" title="Oculta los controles para capturar la ventana">Modo Meet</button>
    </nav>
    <!-- Modo reunión. Es lo único que se ve en ese modo aparte de la cara, así
         que lleva justo lo imprescindible: en qué estado está, lo último que
         entendió, y las cuatro cosas que se pueden pedir. -->
    <div class="reunion" id="reunion" hidden>
      <div class="reunion-estado" id="reunionEstado" data-fase="escuchando">
        <span class="reunion-punto"></span>
        <span id="reunionEstadoTexto">Escuchando</span>
        <span class="reunion-cuenta" id="reunionCuenta"></span>
      </div>
      <p class="reunion-eco" id="reunionEco">Escuchando la reunión. No voy a intervenir hasta que me lo pidas.</p>

      <label class="reunion-hablante">
        <span>Habla</span>
        <input id="reunionQuien" placeholder="Sin identificar" autocomplete="off"
               spellcheck="false" aria-label="Quién está hablando ahora">
      </label>

      <div class="reunion-campo" id="reunionCampo" hidden>
        <label id="reunionCampoTitulo" for="reunionEntrada">Nota</label>
        <input id="reunionEntrada" autocomplete="off" aria-labelledby="reunionCampoTitulo">
        <div class="reunion-campo-acciones">
          <button id="reunionAceptar" class="reunion-si">Guardar</button>
          <button id="reunionCancelar">Cancelar</button>
        </div>
      </div>

      <nav class="reunion-botones" aria-label="Acciones de la reunión">
        <button id="reunionParticipar">Participar</button>
        <button id="reunionNota">Tomar nota</button>
        <button id="reunionDocumento">Agregar documento</button>
        <button id="reunionFinalizar" class="reunion-fin">Finalizar reunión</button>
      </nav>
      <input type="file" id="reunionArchivo" multiple hidden
             accept=".pdf,.docx,.xlsx,.pptx,.doc,.xls,.ppt,.txt,.md,.csv,.json,image/*">
    </div>

    <!-- Resultado del cierre: los dos documentos, dónde quedaron guardados y el
         correo propuesto. El correo NO sale de aquí sin que alguien lo confirme. -->
    <aside class="cierre" id="cierre" data-estado="oculto" aria-label="Cierre de la reunión">
      <header class="cierre-cabecera">
        <span id="cierreTitulo">Cerrando la reunión</span>
        <button class="cierre-cerrar" id="cierreCerrar" aria-label="Cerrar">&times;</button>
      </header>
      <div class="cierre-cuerpo" id="cierreCuerpo"></div>
    </aside>

    <button class="exit-meet" id="exitMeet" aria-label="Salir del modo Meet">Mostrar controles</button>
  </main>
  <audio id="remoteAudio" autoplay></audio>
  <script type="module" src="app.js?v=34"></script>
</body>
</html>
